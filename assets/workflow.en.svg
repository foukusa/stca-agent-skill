<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc" lang="en">
<title id="title">One menu, three ways to work</title>
<desc id="desc">A left-to-right workflow. The STCA main menu branches into three aligned tasks: learn from uploaded repeat-unit data, screen candidates with existing rules, or generate candidates with existing rules. Each task leads to its own result and then returns to the main menu. Rules saved from the first task can be reused in the other two.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0D7381"/></marker>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; fill: #113348; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #506875; }
    .header { font-size: 17px; font-weight: 650; letter-spacing: 1px; fill: #0D7381; }
    .node-title { font-size: 21px; font-weight: 650; }
    .node-detail { font-size: 15.5px; fill: #506875; }
    .menu-title { font-size: 28px; font-weight: 700; fill: #FFFFFF; }
    .menu-detail { font-size: 22px; font-weight: 600; fill: #FFFFFF; }
    .return-title { font-size: 20px; font-weight: 500; fill: #FFFFFF; }
    .footer { font-size: 17px; fill: #506875; }
    .connector { fill: none; stroke: #0D7381; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .task { fill: #FFFFFF; stroke: #0D7381; stroke-width: 2; }
    .result { fill: #F0F7F8; stroke: #A7C7CC; stroke-width: 1.5; }
  </style>
</defs>
<rect width="1400" height="620" fill="#FFFFFF"/>

<text x="700" y="44" class="title" >One menu, three ways to work</text>
<text x="700" y="76" class="subtitle" >Choose a task. Review the result. Return to the main menu.</text>
<text x="170" y="112" class="header" >START</text>
<text x="524" y="112" class="header" >CHOOSE A TASK</text>
<text x="878" y="112" class="header" >REVIEW THE RESULT</text>
<text x="1232" y="112" class="header" >CONTINUE</text>
<g class="connector" aria-hidden="true"><path d="M 300 330 H 344 M 344 180 V 480"/>
<path d="M 344 180 H 386" marker-end="url(#arrow)"/>
<path d="M 654 180 H 740" marker-end="url(#arrow)"/>
<path d="M 1008 180 H 1054"/>
<path d="M 344 330 H 386" marker-end="url(#arrow)"/>
<path d="M 654 330 H 740" marker-end="url(#arrow)"/>
<path d="M 1008 330 H 1054"/>
<path d="M 344 480 H 386" marker-end="url(#arrow)"/>
<path d="M 654 480 H 740" marker-end="url(#arrow)"/>
<path d="M 1008 480 H 1054"/>
<path d="M 1054 180 V 480 M 1054 330 H 1094" marker-end="url(#arrow)"/></g>
<rect x="40" y="276" width="260" height="108" rx="14" fill="#113348"/>
<text x="170" y="322" class="menu-title" >STCA</text>
<text x="170" y="354" class="menu-detail" >Main menu</text>
<rect x="1102" y="276" width="260" height="108" rx="14" fill="#113348"/>
<text x="1232" y="317" class="return-title" >Return to</text>
<text x="1232" y="351" class="menu-detail" >Main menu</text>
<rect x="394" y="126" width="260" height="108" rx="14" class="task"/>
<text x="524" y="158" class="node-title" >1 · Learn from</text>
<text x="524" y="184" class="node-title" >uploaded data</text>
<text x="524" y="213" class="node-detail" >Upload your repeat-unit table</text>
<rect x="748" y="126" width="260" height="108" rx="14" class="result"/>
<path d="M 770 126 H 986" stroke="#D09D37" stroke-width="4" stroke-linecap="round"/>
<text x="878" y="158" class="node-title" >Rules + data screening</text>
<text x="878" y="184" class="node-title" >Save for reuse</text>
<text x="878" y="213" class="node-detail" >Review matches in your data</text>
<rect x="394" y="276" width="260" height="108" rx="14" class="task"/>
<text x="524" y="308" class="node-title" >2 · Screen with</text>
<text x="524" y="334" class="node-title" >existing rules</text>
<text x="524" y="363" class="node-detail" >Choose rules and candidates</text>
<rect x="748" y="276" width="260" height="108" rx="14" class="result"/>
<path d="M 770 276 H 986" stroke="#D09D37" stroke-width="4" stroke-linecap="round"/>
<text x="878" y="308" class="node-title" >Selected candidates</text>
<text x="878" y="334" class="node-title" >and unmet conditions</text>
<text x="878" y="363" class="node-detail" >Review rule matches</text>
<rect x="394" y="426" width="260" height="108" rx="14" class="task"/>
<text x="524" y="458" class="node-title" >3 · Generate with</text>
<text x="524" y="484" class="node-title" >existing rules</text>
<text x="524" y="513" class="node-detail" >Choose rules and design goals</text>
<rect x="748" y="426" width="260" height="108" rx="14" class="result"/>
<path d="M 770 426 H 986" stroke="#D09D37" stroke-width="4" stroke-linecap="round"/>
<text x="878" y="458" class="node-title" >Current LLM generation</text>
<text x="878" y="484" class="node-title" >and rule checks</text>
<text x="878" y="513" class="node-detail" >Check generated repeat units</text>
<path d="M 40 560 H 1362" stroke="#E1E9ED" stroke-width="1"/>
<circle cx="58" cy="588" r="5" fill="#D09D37"/>
<text x="78" y="594" class="footer" style="text-anchor: start">Saved rules from task 1 can be reused in tasks 2 and 3. All completed tasks return to the menu.</text>
</svg>
