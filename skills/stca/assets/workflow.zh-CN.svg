<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">一个主菜单，三条工作路径</title>
<desc id="desc">从左到右的工作流程。STCA主菜单分出三条对齐的路径：从上传的聚合物重复单元数据总结规则、用现成规则筛选候选、用现成规则生成候选。各条路径分别展示对应结果，完成后回到主菜单。第一项任务保存的规则可继续用于第二、三项任务。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0D7381"/></marker>
  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; text-anchor: middle; fill: #113348; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #506875; }
    .header { font-size: 17px; font-weight: 650; letter-spacing: 1px; fill: #0D7381; }
    .node-title { font-size: 21px; font-weight: 650; }
    .node-detail { font-size: 15.5px; fill: #506875; }
    .menu-title { font-size: 28px; font-weight: 700; fill: #FFFFFF; }
    .menu-detail { font-size: 22px; font-weight: 600; fill: #FFFFFF; }
    .return-title { font-size: 20px; font-weight: 500; fill: #FFFFFF; }
    .footer { font-size: 17px; fill: #506875; }
    .connector { fill: none; stroke: #0D7381; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .task { fill: #FFFFFF; stroke: #0D7381; stroke-width: 2; }
    .result { fill: #F0F7F8; stroke: #A7C7CC; stroke-width: 1.5; }
  </style>
</defs>
<rect width="1400" height="620" fill="#FFFFFF"/>

<text x="700" y="44" class="title" >一个主菜单，三条工作路径</text>
<text x="700" y="76" class="subtitle" >选择任务，查看结果，完成后回到主菜单。</text>
<text x="170" y="112" class="header" >进入</text>
<text x="524" y="112" class="header" >选择任务</text>
<text x="878" y="112" class="header" >查看结果</text>
<text x="1232" y="112" class="header" >继续使用</text>
<g class="connector" aria-hidden="true"><path d="M 300 330 H 344 M 344 180 V 480"/>
<path d="M 344 180 H 386" marker-end="url(#arrow)"/>
<path d="M 654 180 H 740" marker-end="url(#arrow)"/>
<path d="M 1008 180 H 1054"/>
<path d="M 344 330 H 386" marker-end="url(#arrow)"/>
<path d="M 654 330 H 740" marker-end="url(#arrow)"/>
<path d="M 1008 330 H 1054"/>
<path d="M 344 480 H 386" marker-end="url(#arrow)"/>
<path d="M 654 480 H 740" marker-end="url(#arrow)"/>
<path d="M 1008 480 H 1054"/>
<path d="M 1054 180 V 480 M 1054 330 H 1094" marker-end="url(#arrow)"/></g>
<rect x="40" y="276" width="260" height="108" rx="14" fill="#113348"/>
<text x="170" y="322" class="menu-title" >STCA</text>
<text x="170" y="354" class="menu-detail" >主菜单</text>
<rect x="1102" y="276" width="260" height="108" rx="14" fill="#113348"/>
<text x="1232" y="317" class="return-title" >完成后</text>
<text x="1232" y="351" class="menu-detail" >回主菜单</text>
<rect x="394" y="126" width="260" height="108" rx="14" class="task"/>
<text x="524" y="158" class="node-title" >1 · 从上传数据</text>
<text x="524" y="184" class="node-title" >总结规则</text>
<text x="524" y="213" class="node-detail" >上传聚合物重复单元数据</text>
<rect x="748" y="126" width="260" height="108" rx="14" class="result"/>
<path d="M 770 126 H 986" stroke="#D09D37" stroke-width="4" stroke-linecap="round"/>
<text x="878" y="158" class="node-title" >规则 + 原始数据回筛</text>
<text x="878" y="184" class="node-title" >保存后可复用</text>
<text x="878" y="213" class="node-detail" >查看原始数据的命中情况</text>
<rect x="394" y="276" width="260" height="108" rx="14" class="task"/>
<text x="524" y="308" class="node-title" >2 · 用现成规则</text>
<text x="524" y="334" class="node-title" >筛选候选</text>
<text x="524" y="363" class="node-detail" >选择规则与候选重复单元</text>
<rect x="748" y="276" width="260" height="108" rx="14" class="result"/>
<path d="M 770 276 H 986" stroke="#D09D37" stroke-width="4" stroke-linecap="round"/>
<text x="878" y="308" class="node-title" >入选候选</text>
<text x="878" y="334" class="node-title" >未满足的规则条件</text>
<text x="878" y="363" class="node-detail" >逐项查看规则匹配情况</text>
<rect x="394" y="426" width="260" height="108" rx="14" class="task"/>
<text x="524" y="458" class="node-title" >3 · 用现成规则</text>
<text x="524" y="484" class="node-title" >生成候选</text>
<text x="524" y="513" class="node-detail" >选择规则并说明设计目标</text>
<rect x="748" y="426" width="260" height="108" rx="14" class="result"/>
<path d="M 770 426 H 986" stroke="#D09D37" stroke-width="4" stroke-linecap="round"/>
<text x="878" y="458" class="node-title" >当前 LLM 生成</text>
<text x="878" y="484" class="node-title" >按规则核验</text>
<text x="878" y="513" class="node-detail" >检查生成的聚合物重复单元</text>
<path d="M 40 560 H 1362" stroke="#E1E9ED" stroke-width="1"/>
<circle cx="58" cy="588" r="5" fill="#D09D37"/>
<text x="78" y="594" class="footer" style="text-anchor: start">第 1 项任务保存的规则，可继续用于第 2、3 项任务。所有任务完成后均回到主菜单。</text>
</svg>
